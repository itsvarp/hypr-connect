[package]
name = "hypr-connect-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.9"
base64 = "0.22.1"
ring = "0.17.14"

[profile.release]
strip = true
lto = true
codegen-units = 1

